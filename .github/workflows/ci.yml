name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Classify change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      risk: ${{ steps.plan.outputs.risk }}
      full: ${{ steps.plan.outputs.full }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      e2e: ${{ steps.plan.outputs.e2e }}
      compose: ${{ steps.plan.outputs.compose }}
      artifacts: ${{ steps.plan.outputs.artifacts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select risk-matched checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          arguments=(--event "${EVENT_NAME}" --github-output "${GITHUB_OUTPUT}")
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            arguments+=(--base "${BASE_SHA}")
          fi
          bash scripts/ci-plan.sh "${arguments[@]}"

  policy:
    name: Policy and CI planner
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate policy scripts
        run: |
          bash -n scripts/change-policy.sh
          bash -n scripts/ci-plan.sh
          bash -n scripts/deploy-release.sh
          bash -n scripts/test-release-deploy.sh
          bash -n scripts/validate-compose.sh
          make test-change-policy
          make test-ci-plan
          make test-release-deploy
      - name: Report selected risk
        env:
          INFERRED_RISK: ${{ needs.plan.outputs.risk }}
          FULL_SUITE: ${{ needs.plan.outputs.full }}
        run: |
          printf 'Inferred minimum risk: %s\n' "${INFERRED_RISK}"
          printf 'Full suite: %s\n' "${FULL_SUITE}"

  static:
    name: Formatting and static analysis
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.4"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install locked dependencies
        run: |
          uv sync --frozen --all-packages
          (cd frontend && bun ci)
      - name: Run checks for the selected range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            uv run prek run --from-ref "${BASE_SHA}" --to-ref HEAD --show-diff-on-failure
          else
            uv run prek run --all-files --show-diff-on-failure
          fi

  backend:
    name: Backend tests
    if: needs.plan.outputs.backend == 'true'
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run migrations and tests
        run: make test-backend DEV_SLOT=0
      - name: Store coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html-${{ github.run_attempt }}
          path: backend/htmlcov
          include-hidden-files: true
          retention-days: 7

  frontend:
    name: Frontend build and static checks
    if: needs.plan.outputs.frontend == 'true'
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install locked dependencies
        run: bun ci
        working-directory: frontend
      - name: Check formatting and types
        run: |
          bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true ./
          bun run build
        working-directory: frontend

  artifacts:
    name: Generated files, locks, migrations, and Compose
    if: needs.plan.outputs.artifacts == 'true'
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.4"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Validate lock files
        run: |
          uv lock --check
          uv sync --frozen --all-packages
          (cd frontend && bun ci)
      - name: Validate generated client
        run: |
          bash scripts/generate-client.sh
          git diff --exit-code -- frontend/src/client
      - name: Validate migration graph
        run: uv run alembic heads
        working-directory: backend
      - name: Validate Compose and backup configuration
        run: make validate-compose

  compose:
    name: Compose smoke test
    if: needs.plan.outputs.compose == 'true'
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke-test isolated stack
        run: |
          cleanup() {
            make dev-down DEV_SLOT=0
          }
          trap cleanup EXIT
          make dev-up DEV_SLOT=0
          curl --fail --show-error --retry 20 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:21001/api/v1/utils/health-check/
          curl --fail --show-error --retry 20 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:21000/

  e2e:
    name: End-to-end tests
    if: needs.plan.outputs.e2e == 'true'
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated browser suite
        run: make test-e2e DEV_SLOT=1
      - name: Store Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ github.run_attempt }}
          path: |
            frontend/blob-report
            frontend/test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  ci-required:
    name: CI Required
    if: always()
    needs:
      - plan
      - policy
      - static
      - backend
      - frontend
      - artifacts
      - compose
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: backend,frontend,artifacts,compose,e2e

  build-images:
    name: Build immutable release images
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.STAGING_ENABLED == 'true' &&
      github.repository_owner != 'fastapi'
    needs:
      - ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      backend-image: ${{ steps.images.outputs.backend-name }}@${{ steps.backend.outputs.digest }}
      frontend-image: ${{ steps.images.outputs.frontend-name }}@${{ steps.frontend.outputs.digest }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select registry image names
        id: images
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          backend_name="ghcr.io/${repository}/backend"
          frontend_name="ghcr.io/${repository}/frontend"
          {
            printf 'backend-name=%s\n' "${backend_name}"
            printf 'backend-tag=%s:%s\n' "${backend_name}" "${GITHUB_SHA}"
            printf 'frontend-name=%s\n' "${frontend_name}"
            printf 'frontend-tag=%s:%s\n' "${frontend_name}" "${GITHUB_SHA}"
          } >>"${GITHUB_OUTPUT}"
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@0a596b2e7a325f0cedf8e9bd21ab002cbd3c9241 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend once
        id: backend
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820 # v6.19.2
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.backend-tag }}
      - name: Build and push environment-neutral frontend once
        id: frontend
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820 # v6.19.2
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.frontend-tag }}
          build-args: |
            VITE_API_URL=
      - name: Record the immutable promotion manifest
        env:
          BACKEND_NAME: ${{ steps.images.outputs.backend-name }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_NAME: ${{ steps.images.outputs.frontend-name }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          {
            printf 'DEPLOY_SHA\t%s\n' "${GITHUB_SHA}"
            printf 'HOMEFIN_BACKEND_IMAGE\t%s@%s\n' "${BACKEND_NAME}" "${BACKEND_DIGEST}"
            printf 'HOMEFIN_FRONTEND_IMAGE\t%s@%s\n' "${FRONTEND_NAME}" "${FRONTEND_DIGEST}"
          } >release-manifest.tsv
      - name: Store the immutable promotion manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.tsv
          overwrite: true
          retention-days: 90

  deploy-staging:
    name: Deploy verified images to staging
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.STAGING_ENABLED == 'true' &&
      github.repository_owner != 'fastapi'
    needs:
      - build-images
    environment: staging
    runs-on:
      - self-hosted
      - staging
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      ENVIRONMENT: staging
      STACK_NAME: ${{ secrets.STACK_NAME }}
      DEPLOY_SHA: ${{ github.sha }}
      HOMEFIN_BACKEND_IMAGE: ${{ needs.build-images.outputs.backend-image }}
      HOMEFIN_FRONTEND_IMAGE: ${{ needs.build-images.outputs.frontend-image }}
      HOMEFIN_BACKUP_DIR: ${{ secrets.HOMEFIN_BACKUP_DIR }}
      HOMEFIN_DEPLOY_STATE_DIR: ${{ secrets.HOMEFIN_DEPLOY_STATE_DIR }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER || 'postgres' }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'app' }}
      FRONTEND_HOST: ${{ secrets.FRONTEND_URL }}
      BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      BUSINESS_TIMEZONE: ${{ vars.BUSINESS_TIMEZONE || 'Asia/Shanghai' }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@0a596b2e7a325f0cedf8e9bd21ab002cbd3c9241 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backup, migrate, deploy, and verify staging
        run: bash scripts/deploy-release.sh
