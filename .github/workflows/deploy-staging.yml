name: Redeploy Verified Staging Image

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Full main-branch commit SHA with a successful CI and staging run
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify requested staging commit
    if: github.repository_owner != 'fastapi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy-sha: ${{ steps.target.outputs.sha }}
      backend-image: ${{ steps.manifest.outputs.backend-image }}
      frontend-image: ${{ steps.manifest.outputs.frontend-image }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the requested commit
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.deploy_sha }}
        run: |
          if [[ ! "${REQUESTED_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'deploy_sha must be a full lowercase commit SHA.\n' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "${REQUESTED_SHA}^{commit}"
          git merge-base --is-ancestor "${REQUESTED_SHA}" origin/main
          printf 'sha=%s\n' "${REQUESTED_SHA}" >>"${GITHUB_OUTPUT}"
      - name: Require a successful full workflow for the same commit
        id: successful-run
        uses: actions/github-script@3a2844b7c99d26ecc95b0ef5c9c24b3a2adf89cc # v8.0.0
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: "main",
              event: "push",
              status: "completed",
              head_sha: process.env.TARGET_SHA,
              per_page: 100,
            });
            const successful = response.data.workflow_runs.find(
              (run) => run.conclusion === "success",
            );
            if (!successful) {
              core.setFailed(`No successful full CI/staging run exists for ${process.env.TARGET_SHA}`);
              return;
            }
            core.setOutput("run-id", successful.id);
      - name: Download the digest manifest from the successful run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest-${{ steps.target.outputs.sha }}
          path: verified-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.successful-run.outputs.run-id }}
      - name: Validate the immutable promotion manifest
        id: manifest
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          manifest="verified-release/release-manifest.tsv"
          manifest_sha="$(awk -F '\t' '$1 == "DEPLOY_SHA" {print $2; exit}' "${manifest}")"
          backend_image="$(awk -F '\t' '$1 == "HOMEFIN_BACKEND_IMAGE" {print $2; exit}' "${manifest}")"
          frontend_image="$(awk -F '\t' '$1 == "HOMEFIN_FRONTEND_IMAGE" {print $2; exit}' "${manifest}")"
          if [[ "${manifest_sha}" != "${TARGET_SHA}" ]]; then
            printf 'Promotion manifest SHA does not match the requested commit.\n' >&2
            exit 1
          fi
          digest_pattern='^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$'
          if [[ ! "${backend_image}" =~ ${digest_pattern} || ! "${frontend_image}" =~ ${digest_pattern} ]]; then
            printf 'Promotion manifest does not contain immutable image references.\n' >&2
            exit 1
          fi
          {
            printf 'backend-image=%s\n' "${backend_image}"
            printf 'frontend-image=%s\n' "${frontend_image}"
          } >>"${GITHUB_OUTPUT}"

  deploy:
    name: Redeploy immutable images to staging
    needs:
      - verify
    environment: staging
    if: github.repository_owner != 'fastapi'
    runs-on:
      - self-hosted
      - staging
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      ENVIRONMENT: staging
      STACK_NAME: ${{ secrets.STACK_NAME }}
      DEPLOY_SHA: ${{ needs.verify.outputs.deploy-sha }}
      HOMEFIN_BACKEND_IMAGE: ${{ needs.verify.outputs.backend-image }}
      HOMEFIN_FRONTEND_IMAGE: ${{ needs.verify.outputs.frontend-image }}
      HOMEFIN_BACKUP_DIR: ${{ secrets.HOMEFIN_BACKUP_DIR }}
      HOMEFIN_DEPLOY_STATE_DIR: ${{ secrets.HOMEFIN_DEPLOY_STATE_DIR }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER || 'postgres' }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'app' }}
      FRONTEND_HOST: ${{ secrets.FRONTEND_URL }}
      BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
      BUSINESS_TIMEZONE: ${{ vars.BUSINESS_TIMEZONE || 'Asia/Shanghai' }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.deploy-sha }}
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backup, migrate, redeploy, and verify staging
        run: bash scripts/deploy-release.sh
