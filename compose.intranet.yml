services:
  backend:
    ports:
      - "8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    ports:
      - "8080:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  adminer:
    image: adminer
    restart: "no"
    profiles:
      - ops
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    ports:
      - "8081:8080"

  db-backup:
    image: prodrigestivill/postgres-backup-local:18
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: "${POSTGRES_DB?Variable not set}"
      POSTGRES_USER: "${POSTGRES_USER?Variable not set}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD?Variable not set}"
      POSTGRES_EXTRA_OPTS: --clean --if-exists
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "3"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - app-db-backups:/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  app-db-backups:
