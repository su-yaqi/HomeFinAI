services:
  db:
    restart: "no"
    ports:
      - "5432:5432"

  prestart:
    restart: "no"
    working_dir: /app/backend
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
    command:
      - bash
      - -lc
      - uv run python app/backend_pre_start.py && uv run python app/legacy_ai_retirement_audit.py && uv run alembic upgrade head && uv run python app/initial_data.py
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/homefin-backend-venv

  backend:
    restart: "no"
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
      - ./backend/htmlcov:/app/backend/htmlcov
    command:
      - bash
      - -lc
      - cd /app/backend && uv run fastapi run --reload app/main.py
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
        - path: ./pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/homefin-backend-venv
      SMTP_HOST: mailcatcher
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: noreply@example.com

  frontend:
    restart: "no"
    ports:
      - "5173:5173"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: build-stage
      args:
        - VITE_API_URL=http://localhost:8000
        - NODE_ENV=development
    working_dir: /app/frontend
    command:
      - sh
      - -lc
      - bun install && bun run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
      - frontend-node-modules-app:/app/frontend/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /app/frontend
        - path: ./package.json
          action: rebuild
        - path: ./bun.lock
          action: rebuild
        - path: ./frontend/package.json
          action: rebuild

  adminer:
    image: adminer
    restart: "no"
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    ports:
      - "8080:8080"

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    environment:
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:-admin@example.com}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:-changethis-local-admin-password}
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - "9323:9323"

volumes:
  uv-cache:
  frontend-node-modules:
  frontend-node-modules-app:
