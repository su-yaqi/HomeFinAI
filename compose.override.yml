name: "homefin-dev-${DEV_SLOT:-0}"

services:
  db:
    restart: "no"

  prestart:
    restart: "no"
    working_dir: /app/backend
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
    command:
      - bash
      - -lc
      - uv run python app/backend_pre_start.py && uv run alembic upgrade head && uv run python app/initial_data.py

  backend:
    restart: "no"
    ports:
      - target: 8000
        published: "${HOMEFIN_BACKEND_PORT:-21001}"
        host_ip: 127.0.0.1
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
      - ./backend/htmlcov:/app/backend/htmlcov
    command:
      - bash
      - -lc
      - cd /app/backend && uv run fastapi run --reload app/main.py
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
        - path: ./pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild
    environment:
      SMTP_HOST: mailcatcher
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: noreply@example.com
      FRONTEND_HOST: "${HOMEFIN_FRONTEND_URL:-http://127.0.0.1:21000}"
      BACKEND_CORS_ORIGINS: "${HOMEFIN_FRONTEND_URL:-http://127.0.0.1:21000}"

  frontend:
    restart: "no"
    ports:
      - target: 5173
        published: "${HOMEFIN_FRONTEND_PORT:-21000}"
        host_ip: 127.0.0.1
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: build-stage
      args:
        - VITE_API_URL=${HOMEFIN_BACKEND_URL:-http://127.0.0.1:21001}
        - NODE_ENV=development
    working_dir: /app/frontend
    command:
      - sh
      - -lc
      - bun install && bun run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
      - frontend-node-modules-app:/app/frontend/node_modules
    environment:
      VITE_API_URL: "${HOMEFIN_BACKEND_URL:-http://127.0.0.1:21001}"
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /app/frontend
        - path: ./package.json
          action: rebuild
        - path: ./bun.lock
          action: rebuild
        - path: ./frontend/package.json
          action: rebuild

  adminer:
    image: adminer
    restart: "no"
    profiles:
      - adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    ports:
      - target: 8080
        published: "${HOMEFIN_ADMINER_PORT:-21003}"
        host_ip: 127.0.0.1

  mailcatcher:
    image: schickling/mailcatcher
    profiles:
      - mail
      - playwright

  playwright:
    profiles:
      - playwright
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    environment:
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:-admin@example.com}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:-changethis-local-admin-password}
      - CI=${CI:-}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results

volumes:
  app-db-data:
    labels:
      com.homefin.dev.workspace: "${HOMEFIN_WORKSPACE_ID:-direct-compose}"
  app-data-jobs-data:
    labels:
      com.homefin.dev.workspace: "${HOMEFIN_WORKSPACE_ID:-direct-compose}"
  uv-cache:
    labels:
      com.homefin.dev.workspace: "${HOMEFIN_WORKSPACE_ID:-direct-compose}"
  frontend-node-modules:
    labels:
      com.homefin.dev.workspace: "${HOMEFIN_WORKSPACE_ID:-direct-compose}"
  frontend-node-modules-app:
    labels:
      com.homefin.dev.workspace: "${HOMEFIN_WORKSPACE_ID:-direct-compose}"
